services:
  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
  backend:
    build:
      context: ${BACKEND_DIR:-../backEnd}
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - ${BACKEND_DIR:-../backEnd}/server/database:/data
