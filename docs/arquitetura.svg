<rect x="590" y="355" width="235" height="85" rx="12" fill="#e5f4eb"/>
</g>
<g text-anchor="middle" font-size="19" font-weight="bold">
<text x="135" y="192">Navegador</text><text x="410" y="192">Interface / Nginx</text><text x="707" y="192">API Flask</text><text x="987" y="192">ViaCEP</text><text x="707" y="389">SQLite</text>
</g>
<g text-anchor="middle" font-size="14">
<text x="135" y="223">Cadastro e edição</text><text x="410" y="223">HTML, CSS e JavaScript</text><text x="707" y="223">Regras e validação</text><text x="987" y="223">Serviço externo</text><text x="707" y="418">Arquivo persistido na máquina</text>
<text x="267" y="137">:8080</text><text x="560" y="122">REST / JSON</text><text x="560" y="141">/api/</text><text x="852" y="137">HTTPS</text><text x="800" y="304">Volume /data</text>
<text x="410" y="283">Container frontend</text><text x="707" y="283">Container backend • :5000</text>
