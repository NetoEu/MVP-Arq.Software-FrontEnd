<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do sistema de controle de pedidos</title>
<desc id="desc">Navegador acessa a interface no Nginx. O proxy encaminha requisições REST à API Flask, que consulta ViaCEP e persiste no arquivo SQLite montado na máquina.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43617b"/></marker></defs>
<rect width="1120" height="490" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#18344c">
<text x="40" y="48" font-size="26" font-weight="bold">Controle de pedidos • Cenário 1.1</text>
<text x="40" y="78" font-size="16">Dois componentes próprios em containers e um serviço externo</text>
<g fill="#fff" stroke="#43617b" stroke-width="2">
<rect x="40" y="150" width="190" height="105" rx="12"/>
<rect x="305" y="150" width="210" height="105" rx="12"/>
<rect x="605" y="150" width="205" height="105" rx="12"/>
